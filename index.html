<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#111114" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%234c0081'/%3E%3C/svg%3E"
    />
    <title>MUSEUM</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111114;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      .hidden {
        display: none !important;
      }

      /* Loading / enter overlay */
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: rgba(10, 10, 14, 0.96);
        color: #e8e6e3;
      }
      #overlay h1 {
        margin: 0;
        font-size: 42px;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-indent: 0.35em;
      }
      #load-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: min(320px, 70vw);
      }
      #load-bar {
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #load-fill {
        width: 0%;
        height: 100%;
        background: #9d7bff;
        transition: width 0.15s ease-out;
      }
      #load-text {
        font-size: 13px;
        opacity: 0.7;
      }
      #enter-btn {
        padding: 12px 44px;
        font-size: 16px;
        letter-spacing: 0.2em;
        color: #e8e6e3;
        background: rgba(157, 123, 255, 0.18);
        border: 1px solid rgba(157, 123, 255, 0.55);
        border-radius: 4px;
        cursor: pointer;
      }
      #enter-btn:hover {
        background: rgba(157, 123, 255, 0.32);
      }

      /* Crosshair (desktop) */
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
        z-index: 5;
        pointer-events: none;
      }

      /* Virtual joysticks (Android) */
      .joy {
        position: fixed;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.28);
        z-index: 6;
        touch-action: none;
      }
      .joy-left {
        left: 22px;
        bottom: 26px;
      }
      .joy-right {
        right: 22px;
        bottom: 26px;
      }
      .joy-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 56px;
        height: 56px;
        margin: -28px 0 0 -28px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.38);
        border: 1px solid rgba(255, 255, 255, 0.5);
        pointer-events: none;
      }

      /* Teleport warp FX */
      #warp-overlay {
        position: fixed;
        inset: 0;
        z-index: 15;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(150, 60, 255, 0) 0%,
          rgba(120, 30, 220, 0.35) 45%,
          rgba(60, 0, 120, 0.8) 100%
        );
      }
      #warp-overlay.active {
        animation: warpflash 0.8s ease-in-out;
      }
      @keyframes warpflash {
        0% {
          opacity: 0;
        }
        35% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      canvas.warping {
        animation: warpcanvas 0.8s ease-in-out;
      }
      @keyframes warpcanvas {
        0% {
          filter: none;
        }
        35% {
          filter: blur(5px) saturate(2.2) hue-rotate(25deg);
        }
        100% {
          filter: none;
        }
      }

      /* Fullscreen painting viewer */
      #painting-viewer {
        position: fixed;
        inset: 0;
        z-index: 30;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(5, 5, 8, 0.94);
        padding: 20px;
      }
      #painting-viewer img {
        max-width: 94vw;
        max-height: 86vh;
        object-fit: contain;
        box-shadow: 0 8px 60px rgba(0, 0, 0, 0.8);
      }
      .viewer-caption {
        color: #e8e6e3;
        font-size: 14px;
        text-align: center;
        max-width: 90vw;
      }
      .viewer-hint {
        color: rgba(232, 230, 227, 0.45);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>MUSEUM</h1>
      <div id="load-wrap">
        <div id="load-bar"><div id="load-fill"></div></div>
        <div id="load-text">Loading&hellip;</div>
      </div>
      <button id="enter-btn" class="hidden">ENTER</button>
    </div>
    <div id="crosshair" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
